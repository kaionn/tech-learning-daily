name: Site deploy tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/tests/*.test.mjs
      # bash -n は 2 つ目以降の引数を検査対象にしないため、1 ファイルずつ実行する。
      - run: bash -n scripts/deploy-current-site.sh
      - run: bash -n scripts/deploy-workers-preview.sh
