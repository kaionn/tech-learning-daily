name: Deploy latest main snapshot

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  # ref 条件は付けない。daily-article.yml は dispatch 元 ref に関係なく main へ push するため、
  # 条件で skip すると公開済みコミットが未デプロイのまま残る。
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy latest main to selected static host
        env:
          SITE_DEPLOY_TARGET: ${{ vars.SITE_DEPLOY_TARGET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-current-site.sh
