name: Deploy site (manual content push)

# 手動 push（ローカルセッションからのサイトアセット変更）を選択済みの Cloudflare ホストに反映する。
# 日次 run（daily-article.yml）は GITHUB_TOKEN で push するため本 workflow は発火せず、
# 二重デプロイにはならない（日次 run は自前で Cloudflare へ deploy する）。

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'archive/**'
      - 'data/**'
      - 'scripts/**'
      - style.css
      - feed.xml
      - favicon.ico
      - icon-192.png
      - apple-touch-icon.png
      - wrangler.jsonc

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-current-site.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
